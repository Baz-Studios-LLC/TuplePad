[package]
name = "tuplepad-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TuplePad's built-in MCP server: AI tools read and edit the open documents."

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "schemars", "transport-async-rw", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tokio-util = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"

[dev-dependencies]
rmcp = { version = "3.5", features = ["client", "transport-async-rw"] }

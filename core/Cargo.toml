[workspace]
resolver = "3"
members = ["tuplepad-core", "tuplepad-cli", "tuplepad-app", "tuplepad-mcp", "uniffi-bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
lto = true
codegen-units = 1

# Cargo strips release proc-macro dylibs by default, and the strip in the
# Xcode 27 toolchain leaves them in a form macOS 27's dyld refuses to load
# ("mis-aligned LINKEDIT string pool"). Build-time code doesn't need stripping.
[profile.release.build-override]
strip = false

# What `Launch TuplePad.command` builds: fully optimized code, but without whole-program
# (LTO) optimization and with incremental compiling, so rebuilding after a change takes
# seconds rather than minutes. `release` stays the one to ship.
[profile.launch]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

[profile.launch.build-override]
strip = false

# Debug builds still need to open huge files quickly: optimize dependencies
# (ropey, encoding_rs) fully and our own code lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

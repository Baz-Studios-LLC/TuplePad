[package]
name = "tuplepad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TuplePad: the editor app for Mac, Windows and Linux, built with Slint on tuplepad-core."

[[bin]]
name = "TuplePad"
path = "src/main.rs"

[dependencies]
tuplepad-core = { path = "../tuplepad-core" }
slint = { version = "1.18", features = ["unstable-fontique-011", "unstable-winit-030", "renderer-skia"] }
parley = "0.11"
unicode-segmentation = "1"
unicode-width = "0.2"
arboard = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "1.18"

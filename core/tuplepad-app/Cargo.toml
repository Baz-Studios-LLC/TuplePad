[package]
name = "tuplepad-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TuplePad: the editor app for Mac, Windows and Linux, built with Slint on tuplepad-core."

# Not "TuplePad": on a case-insensitive disk that would be the same file as the `tuplepad`
# command, which builds into the same folder. The Mac bundle calls it TuplePad.
[[bin]]
name = "tuplepad-app"
path = "src/main.rs"

[dependencies]
tuplepad-core = { path = "../tuplepad-core" }
slint = { version = "1.18", features = ["unstable-fontique-011", "unstable-winit-030", "renderer-skia"] }
parley = "0.11"
unicode-segmentation = "1"
unicode-width = "0.2"
arboard = "3"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSURL", "NSString", "NSAttributedString", "NSData", "NSDictionary", "NSGeometry", "NSValue"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSAttributedString", "NSPrintInfo", "NSPrintOperation", "NSText", "NSTextView", "NSTextStorage", "NSView"] }

[build-dependencies]
slint-build = "1.18"

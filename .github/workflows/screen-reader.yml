# Real screen readers read TuplePad while it's used with real key presses: Orca on Linux,
# VoiceOver on macOS and NVDA on Windows (driven by Guidepup), and Narrator on Windows (read back
# through its own copy-last-phrase command).
# Ubuntu 24.04's Orca (46): older Orca asks for lines with AT-SPI's deprecated GetTextAtOffset,
# which AccessKit (Slint's accessibility layer) doesn't answer.
name: Screen reader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orca:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev libgl1-mesa-dev \
            libegl1-mesa-dev xvfb xdotool orca at-spi2-core speech-dispatcher espeak-ng pulseaudio pulseaudio-utils
      - name: py-spy (to see where Orca waits)
        run: pip install py-spy
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --manifest-path core/Cargo.toml -p tuplepad-app
      - name: Orca reads TuplePad
        run: dbus-run-session -- bash .github/orca-linux.sh core/target/debug/tuplepad-app
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: orca-log
          path: ${{ runner.temp }}/orca-check/*.txt

  voiceover-and-nvda:
    strategy:
      fail-fast: false
      matrix:
        # macOS 14: Guidepup's setup turns on Do Not Disturb through Control Center, which it can't on 15's image.
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --manifest-path core/Cargo.toml -p tuplepad-app
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Guidepup
        run: npm install --no-save --no-package-lock @guidepup/guidepup@0.35.0 @guidepup/setup@0.29.1
      - name: Screen reader set up for automation
        run: npx guidepup setup --ci
      - name: NVDA
        if: runner.os == 'Windows'
        run: npx guidepup install nvda
      - name: VoiceOver's portable preferences
        if: runner.os == 'macOS'
        run: npx guidepup install voiceover
      - name: The screen reader reads TuplePad
        shell: bash
        run: node .github/screen-reader.mjs core/target/debug/tuplepad-app${{ runner.os == 'Windows' && '.exe' || '' }}

  narrator:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - name: Build
        run: cargo build --locked --manifest-path core/Cargo.toml -p tuplepad-app
      - name: Narrator reads TuplePad
        shell: powershell
        run: .\.github\narrator-windows.ps1 core\target\debug\tuplepad-app.exe
